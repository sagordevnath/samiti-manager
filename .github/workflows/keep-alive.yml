name: API keep-alive

# A free-tier web service (Render stops an instance after ~15 minutes without
# traffic) holds the next request while it boots, so the first visitor after a
# quiet period waits ~a minute for the dashboard. Pinging the health endpoint
# every 10 minutes keeps it warm.
#
# The same run is the uptime check from docs/go-live.md §5: an unreachable API,
# a non-200 response, or a 200 that is not samity-api's health payload fails the
# run, so a broken deployment shows up as a red X rather than as a slow site.
#
# Free here because this repository is public (unmetered GitHub-hosted minutes).
# Scheduled runs are delayed or dropped under GitHub load and are disabled after
# 60 days without repository activity — see docs/deploy.md §4 for the caveats and
# for machine-level alternatives.

on:
  schedule:
    # Every 10 minutes, comfortably inside the ~15-minute idle timer. Cron is
    # UTC; the cadence is timezone-independent.
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # manual run right after a deploy

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ping the deployed API
        env:
          # Repository variable (Settings → Secrets and variables → Actions →
          # Variables → New repository variable). It is a public URL, not a
          # secret. Leave it unset to use the service name render.yaml assigns:
          # https://samity-api.onrender.com/api/v1/health — set it when the API
          # lives elsewhere, or when Render gave the service a different name.
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          # Optional: also record this run as a sample on the public status page
          # (status/, docs/deploy.md §9). Set the URL as a variable and the
          # token as a secret; both empty is fine — the ping still works and the
          # page falls back to sampling on its own visits.
          STATUS_INGEST_URL: ${{ vars.STATUS_INGEST_URL }}
          STATUS_INGEST_TOKEN: ${{ secrets.STATUS_INGEST_TOKEN }}
        run: bash scripts/keep-alive.sh
